<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./responsive-design.css">
        <title>responsive-design</title>
    </head>
    <body>
            <div class="img-grid-container">
                <div class="head-img">
                    <img id="profile-pic" src="./images/profile-picture.png" alt="profile picture">
                </div>
            </div>

        <main>
            <!-- contact -->
            <section class="contact">
                <div class="contact-container">
                    <div class="text-container">
                        <div id="id-card-list">
                            <ul>
                                <li>Name</li>
                                <li>Role</li>
                                <li>Contact</li>
                            </ul>
                        </div>
                        <div id="id-card-details">
                            <ul>
                                <li>Joel</li>
                                <li>Student</li>
                                <li>Na</li>
                            </ul>
                        </div>

                    </div>
                </div>
            </section>
            <!-- about me -->
            <section class="about-me">
                <div class="about-me-container">
                    <div class="text-container">
                        <p>about me card</p>
                    </div>
                </div>
            </section>


        </main>
    </body>
    </html>
